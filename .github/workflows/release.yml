name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.platform.os }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, suffix: .exe, name: T_Music_Bot_RPC }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, suffix: "", name: T_Music_Bot-RPC }
          - { os: macos-latest, target: x86_64-apple-darwin, suffix: "", name: T_Music_Bot-RPC_Intel }
          - { os: macos-latest, target: aarch64-apple-darwin, suffix: "", name: T_Music_Bot-RPC_Apple_Silicon }

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies (Linux)
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          # Exact naming per user requirement
          cp "target/${{ matrix.platform.target }}/release/t-music-bot-rpc${{ matrix.platform.suffix }}" "dist/${{ matrix.platform.name }}${{ matrix.platform.suffix }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
