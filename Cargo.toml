[package]
name = "t-music-bot-rpc"
version = "2.0.3"
edition = "2021"

[dependencies]
# Async Engine
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
futures-util = "0.3"

# Discord RPC
discord-rich-presence = "0.2"

# Image Processing
image = { version = "0.24", default-features = false, features = ["ico", "png"] }

# Audio Capture (Native Rust)
cpal = "0.15"
rustfft = "6.1"

# Web Server (Axum 0.7)
axum = { version = "0.7", features = ["ws", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["fs"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
uuid = { version = "1.0", features = ["v4"] }

# UI & Tray
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }
open = "5.0"
crossbeam-channel = "0.5"

# Logging
chrono = "0.4"

# Utils
rand = "0.9"
base64 = "0.22"
ctrlc = "3.5.2"
self-replace = "1.5"
minreq = { version = "2.11", features = ["https-native", "json-using-serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
gtk = "0.18"

# Windows Specific
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[build-dependencies]
winres = "0.1"

# PRODUCTION PROFILE
[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

# WINDOWS TESTING PROFILE
[profile.win-test]
inherits = "release"
strip = false
debug = true
opt-level = 2
